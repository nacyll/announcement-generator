<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8b1e4 0%, #a6c1ee 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .user-info {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 13px;
        }
        .sync-status { 
            display: inline-block; 
            margin-top: 10px;
            margin-left: 10px;
            padding: 5px 12px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 20px; 
            font-size: 12px; 
        }
        .sync-status.online { background: rgba(76, 175, 80, 0.3); }
        .sync-status.offline { background: rgba(244, 67, 54, 0.3); }
        .content { padding: 30px; }
        .section { margin-bottom: 30px; }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .generate-btn {
            flex: 1;
            padding: 15px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .announcement-list { display: none; }
        .announcement-list.show { display: block; }
        .announcement-item { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .announcement-item.confirmed { background: #e8f5e9; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-content { flex: 1; line-height: 1.6; color: #333; white-space: pre-wrap; word-wrap: break-word; }
        .item-content .highlight { color: #e53935; font-weight: 500; }
        .item-actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .confirm-btn { background: #4caf50; color: white; }
        .unconfirm-btn { background: #f44336; color: white; }
        .edit-btn { background: #2196f3; color: white; }
        .copy-btn { background: #ff9800; color: white; }
        .confirmed-badge {
            display: none;
            align-items: center;
            color: #4caf50;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            background: white;
            border-radius: 12px;
            border: 1px solid #4caf50;
        }
        .confirmed-badge.show { display: flex; }
        .edit-area { display: none; margin-top: 10px; }
        .edit-area.show { display: block; }
        .edit-textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 2px solid #2196f3;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            font-family: inherit;
        }
        .edit-actions { display: flex; gap: 8px; margin-top: 8px; }
        .save-btn, .cancel-btn { padding: 8px 16px; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .save-btn { background: #4caf50; }
        .cancel-btn { background: #757575; }
        .final-announcement { display: none; background: #f5f5f5; border-radius: 8px; padding: 20px; margin-top: 30px; }
        .final-announcement.show { display: block; }
        .final-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .final-content { background: white; padding: 20px; border-radius: 8px; line-height: 1.8; white-space: pre-wrap; max-height: 500px; overflow-y: auto; }
        .copy-all-btn { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .toast { position: fixed; top: 20px; right: 20px; background: #323232; color: white; padding: 12px 20px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #667eea;
            z-index: 999;
        }
        .loading-overlay.hide { display: none; }
    </style>
</head>
<body>
    <!-- 加载中遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">🔄 正在获取用户信息...</div>

    <!-- 主页面 -->
    <div class="container">
        <div class="header">
            <h1>📢 公告生成器</h1>
            <p>输入内容 → 确认生成</p>
            <div class="user-info">👤 当前用户：<span id="usernameDisplay">加载中...</span></div>
            <div class="sync-status" id="syncStatus">🔄 连接中...</div>
        </div>
        <div class="content">
            <div class="section">
                <div class="section-title">步骤 1：输入公告内容</div>
                <textarea id="announcementInput" placeholder="请输入公告内容..."></textarea>
                <div class="btn-group">
                    <button class="generate-btn" id="generateBtn" disabled>生成公告列表</button>
                </div>
            </div>
            <div class="section">
                <div class="section-title">步骤 2：确认公告内容</div>
                <div class="announcement-list" id="announcementList"></div>
            </div>
            <div class="final-announcement" id="finalAnnouncement">
                <div class="final-title">
                    <span>✅ 正式公告</span>
                    <button class="copy-all-btn" id="copyAllBtn">📋 一键复制</button>
                </div>
                <div class="final-content" id="finalContent"></div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDh5lG_Y-vi4JJz0BKGciJozuTUzyc_Uqs",
            authDomain: "announcement-1d3b8.firebaseapp.com",
            databaseURL: "https://announcement-1d3b8-default-rtdb.firebaseio.com",
            projectId: "announcement-1d3b8",
            storageBucket: "announcement-1d3b8.firebasestorage.app",
            messagingSenderId: "211900035801",
            appId: "1:211900035801:web:8336d3fca5e97c152784c8",
            measurementId: "G-JTH1FG6378"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const announcementRef = database.ref('announcements');

        let currentUser = '';  // 自动获取的用户名
        let announcements = [];

        async function fetchUserInfo() {
            try {
                // 尝试调用平台的用户信息接口
                const res = await fetch('/qkit_auth/user_info/', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    // 可能的字段: username, user, name, email
                    currentUser = data.username || data.user || data.name || 
                                  (data.email ? data.email.split('@')[0] : '');
                    if (currentUser) return true;
                }
            } catch (e) {
                console.log('获取用户信息失败:', e);
            }
            
            // 备用：尝试从 localStorage 读取（有些平台会存储）
            try {
                const stored = localStorage.getItem('userInfo') || localStorage.getItem('user');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    currentUser = parsed.username || parsed.user || parsed.name || '';
                    if (currentUser) return true;
                }
            } catch (e) {}

            // 如果都获取不到，使用默认值
            currentUser = '未知用户';
            return false;
        }

        async function init() {
            await fetchUserInfo();
            document.getElementById('usernameDisplay').textContent = currentUser;
            document.getElementById('loadingOverlay').classList.add('hide');
        }

        database.ref('.info/connected').on('value', (snap) => {
            const status = document.getElementById('syncStatus');
            status.textContent = snap.val() ? '🟢 已连接云端' : '🔴 离线';
            status.className = 'sync-status ' + (snap.val() ? 'online' : 'offline');
        });

        announcementRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.items) {
                announcements = Array.isArray(data.items) ? data.items : Object.values(data.items).filter(Boolean);
            } else {
                announcements = [];
            }
            renderAnnouncementList();
            if (announcements.length > 0) document.getElementById('announcementList').classList.add('show');
        });

        document.getElementById('announcementInput').addEventListener('input', function() {
            document.getElementById('generateBtn').disabled = !this.value.trim();
        });

        document.getElementById('generateBtn').addEventListener('click', function() {
            const input = document.getElementById('announcementInput').value.trim();
            if (!input) return;
            announcements = parseAnnouncement(input);
            saveToFirebase();
            document.getElementById('announcementList').classList.add('show');
        });

        function saveToFirebase() {
            announcementRef.set({ items: announcements, updatedAt: Date.now() });
        }

        function parseAnnouncement(text) {
            const lines = text.split('\n'), items = [];
            let currentContent = '', lastLineEmpty = true;
            for (let line of lines) {
                const t = line.trim();
                if (!t) { lastLineEmpty = true; continue; }
                if (lastLineEmpty || /^【[^】]+】/.test(t) || /^\d+[.。>)）]/.test(t)) {
                    if (currentContent) items.push({ content: currentContent.trim(), confirmed: false, confirmedBy: '', confirmedTime: '' });
                    currentContent = t;
                } else { currentContent += '\n' + t; }
                lastLineEmpty = false;
            }
            if (currentContent) items.push({ content: currentContent.trim(), confirmed: false, confirmedBy: '', confirmedTime: '' });
            return items;
        }

        function renderAnnouncementList() {
            const container = document.getElementById('announcementList');
            container.innerHTML = '';
            announcements.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'announcement-item' + (item.confirmed ? ' confirmed' : '');
                div.innerHTML = `<div class="item-header"><div class="item-content">${highlightContent(item.content)}</div><div class="item-actions">${!item.confirmed ? `<button class="action-btn confirm-btn" onclick="confirmItem(${i})">✓ 确认</button>` : `<span class="confirmed-badge show">✓ ${item.confirmedBy} ${item.confirmedTime}</span><button class="action-btn unconfirm-btn" onclick="unconfirmItem(${i})">✗ 取消</button>`}<button class="action-btn edit-btn" onclick="editItem(${i})">✎ 编辑</button><button class="action-btn copy-btn" onclick="copyItem(${i})">📋 复制</button></div></div><div class="edit-area" id="edit-${i}"><textarea class="edit-textarea" id="textarea-${i}">${item.content}</textarea><div class="edit-actions"><button class="save-btn" onclick="saveEdit(${i})">保存</button><button class="cancel-btn" onclick="cancelEdit(${i})">取消</button></div></div>`;
                container.appendChild(div);
            });
            checkAllConfirmed();
        }

        function highlightContent(c) { return c.replace(/(\d{4}年)?\d{1,2}月\d{1,2}日|\d{1,2}:\d{2}/g, '<span class="highlight">$&</span>').replace(/(\d+)(级|倍|折|次|个|名|期)/g, '<span class="highlight">$1</span>$2').replace(/\n/g, '<br>'); }
        function confirmItem(i) { announcements[i].confirmed = true; announcements[i].confirmedBy = currentUser; announcements[i].confirmedTime = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}); saveToFirebase(); }
        function unconfirmItem(i) { announcements[i].confirmed = false; saveToFirebase(); }
        function editItem(i) { document.getElementById(`edit-${i}`).classList.add('show'); }
        function saveEdit(i) { const c = document.getElementById(`textarea-${i}`).value.trim(); if(c) { announcements[i].content = c; announcements[i].confirmed = false; saveToFirebase(); } }
        function cancelEdit(i) { document.getElementById(`edit-${i}`).classList.remove('show'); }
        function copyItem(i) { copyToClipboard(announcements[i].content); showToast('已复制'); }
        function checkAllConfirmed() { const ok = announcements.length > 0 && announcements.every(x => x.confirmed); document.getElementById('finalAnnouncement').classList.toggle('show', ok); if(ok) document.getElementById('finalContent').innerHTML = highlightContent(announcements.map(x => x.content).join('\n\n')); }
        document.getElementById('copyAllBtn').addEventListener('click', () => { copyToClipboard(announcements.map(x => x.content).join('\n\n')); showToast('已复制完整公告'); });
        function copyToClipboard(t) { navigator.clipboard.writeText(t).catch(() => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }); }
        function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

        // 启动
        init();
    </script>
</body>
</html>
